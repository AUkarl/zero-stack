name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.149+ 要求 Node ≥ 22，这里低于 22 会让 packages/api build 直接失败
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Type check scripts
        run: pnpm typecheck:scripts
      - name: Type check
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
